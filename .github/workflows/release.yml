name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-full:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install full build profile
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt -r requirements-optional.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Optional Yosys syntax validation
        shell: pwsh
        run: |
          if (Get-Command yosys -ErrorAction SilentlyContinue) {
            python -m unittest tests.test_platform_v4.HdlTests.test_export_passes_yosys_when_available -v
          } else {
            Write-Host "Yosys is not installed; HDL syntax validation skipped"
          }
      - name: Build full Windows executable
        run: python -m PyInstaller --noconfirm --clean PyLabViewStudioFull.spec
      - name: Frozen full-profile self-test
        shell: pwsh
        run: |
          $process = Start-Process ".\dist\PyLabViewStudioFull.exe" -ArgumentList "--self-test-full" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen full-profile self-test failed with exit code $($process.ExitCode)"
          }
      - name: Create full-profile checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/PyLabViewStudioFull.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  PyLabViewStudioFull.exe" | Set-Content -Encoding ascii "dist/PyLabViewStudioFull.exe.sha256"
      - name: Attach full profile to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" `
            "dist/PyLabViewStudioFull.exe" `
            "dist/PyLabViewStudioFull.exe.sha256" `
            --repo "${{ github.repository }}" `
            --clobber
      - name: Upload full-profile artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyLabViewStudio-Full-Windows-${{ github.ref_name }}
          path: |
            dist/PyLabViewStudioFull.exe
            dist/PyLabViewStudioFull.exe.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Optional Yosys syntax validation
        shell: pwsh
        run: |
          if (Get-Command yosys -ErrorAction SilentlyContinue) {
            python -m unittest tests.test_platform_v4.HdlTests.test_export_passes_yosys_when_available -v
          } else {
            Write-Host "Yosys is not installed; HDL syntax validation skipped"
          }

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean PyLabViewStudio.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PyLabViewStudio.exe")) {
            throw "PyLabViewStudio.exe was not produced"
          }
          Get-Item "dist/PyLabViewStudio.exe" | Format-List Name,Length,LastWriteTime

      - name: Frozen self-test
        shell: pwsh
        run: |
          $process = Start-Process ".\dist\PyLabViewStudio.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen self-test failed with exit code $($process.ExitCode)"
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/PyLabViewStudio.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  PyLabViewStudio.exe" | Set-Content -Encoding ascii "dist/PyLabViewStudio.exe.sha256"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/PyLabViewStudio.exe" `
            "dist/PyLabViewStudio.exe.sha256" `
            --repo "${{ github.repository }}" `
            --title "PyLabView Studio ${{ github.ref_name }}" `
            --generate-notes

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyLabViewStudio-Windows-${{ github.ref_name }}
          path: |
            dist/PyLabViewStudio.exe
            dist/PyLabViewStudio.exe.sha256
          if-no-files-found: error
